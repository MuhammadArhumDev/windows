name: Windows RDP

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: windows-latest

    steps:
      - name: Enable RDP
        run: |
          # Enable RDP
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

      - name: Enable and Configure Administrator Account
        run: |
          # Enable the Administrator account
          $adminName = "Administrator"
          $adminPassword = "${{ secrets.ROOT_PASSWORD }}"

          # Check if the Administrator account exists
          $adminExists = Get-LocalUser -Name $adminName -ErrorAction SilentlyContinue

          if (-not $adminExists) {
              # Create the Administrator account if it doesn't exist
              New-LocalUser -Name $adminName -Password (ConvertTo-SecureString $adminPassword -AsPlainText -Force) -AccountNeverExpires -PasswordNeverExpires
              Add-LocalGroupMember -Group "Administrators" -Member $adminName
          } else {
              # Enable the Administrator account if it exists
              Enable-LocalUser -Name $adminName
          }

          # Set the password for the Administrator account
          Set-LocalUser -Name $adminName -Password (ConvertTo-SecureString $adminPassword -AsPlainText -Force)

      - name: Install Ngrok
        run: |
          # Download and install Ngrok
          Invoke-WebRequest -Uri "https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip" -OutFile "ngrok.zip"
          Expand-Archive -Path "ngrok.zip" -DestinationPath "C:\ngrok"
          Remove-Item -Path "ngrok.zip"

      - name: Authenticate Ngrok
        run: |
          # Authenticate Ngrok with the provided token
          C:\ngrok\ngrok.exe authtoken "${{ secrets.NGROK_AUTH_TOKEN }}"

      - name: Start Ngrok Tunnel
        run: |
          # Start Ngrok tunnel for RDP (port 3389)
          # Start-Process -NoNewWindow -FilePath "C:\ngrok\ngrok.exe" -ArgumentList "tcp 3389"
          & "C:\ngrok\ngrok.exe" tcp --region=us 3389 > ngrok.log 2>&1

      - name: Print RDP Debug Info
        run: |
          # Print the IP address and Ngrok tunnel information
          ipconfig
          # Get-Content -Path "$env:USERPROFILE\.ngrok2\ngrok.yml"

      - name: Keep Runner Alive
        run: |
          # Keep the runner alive for 6 hours
          Start-Sleep -Seconds 21600
