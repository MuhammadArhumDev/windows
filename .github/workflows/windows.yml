name: Debug with RDP

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: windows-latest

    steps:
      - name: Enable RDP
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

      - name: Enable and Configure Administrator Account
        run: |
          $adminName = "Administrator"
          $adminPassword = "${{ secrets.ROOT_PASSWORD }}"

          $adminExists = Get-LocalUser -Name $adminName -ErrorAction SilentlyContinue

          if (-not $adminExists) {
              New-LocalUser -Name $adminName -Password (ConvertTo-SecureString $adminPassword -AsPlainText -Force) -AccountNeverExpires -PasswordNeverExpires
              Add-LocalGroupMember -Group "Administrators" -Member $adminName
          } else {
              Enable-LocalUser -Name $adminName
          }

          Set-LocalUser -Name $adminName -Password (ConvertTo-SecureString $adminPassword -AsPlainText -Force)

      - name: Install Ngrok
        run: |
          Invoke-WebRequest -Uri "https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip" -OutFile "ngrok.zip"
          Expand-Archive -Path "ngrok.zip" -DestinationPath "C:\ngrok"
          Remove-Item -Path "ngrok.zip"

      - name: Authenticate Ngrok
        run: |
          C:\ngrok\ngrok.exe authtoken "${{ secrets.NGROK_AUTH_TOKEN }}"

      - name: Start Ngrok Tunnel
        run: |
          Start-Process -FilePath "C:\ngrok\ngrok.exe" -ArgumentList "tcp 3389" -NoNewWindow

      - name: Wait for Tunnel and Print RDP URL
        run: |
          Start-Sleep -Seconds 10
          try {
              $response = Invoke-RestMethod -Uri "http://127.0.0.1:4040/api/tunnels"
              $rdpTunnel = $response.tunnels | Where-Object {$_.proto -eq "tcp"}
              Write-Host "🔗 RDP Address: $($rdpTunnel.public_url)"
              Write-Host "🛠 Use Administrator and your root password to connect."
          } catch {
              Write-Host "❌ Failed to get Ngrok tunnel info. Ngrok might not have started."
          }

      - name: Print IP Config
        run: ipconfig

      - name: Keep Runner Alive
        run: Start-Sleep -Seconds 21600  # 6 hours
