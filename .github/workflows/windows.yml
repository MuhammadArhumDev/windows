name: Debug with RDP

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: windows-latest

    steps:
      - name: Enable RDP
        run: |
          # Enable RDP
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name fDenyTSConnections -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

      - name: Enable and Configure Administrator Account
        run: |
          # Enable the built-in Administrator account and set its password
          Enable-LocalUser -Name Administrator
          $securePass = ConvertTo-SecureString "${{ secrets.ROOT_PASSWORD }}" -AsPlainText -Force
          Set-LocalUser -Name Administrator -Password $securePass

      - name: Install Ngrok
        run: |
          # Download and install Ngrok
          Invoke-WebRequest -Uri "https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip" -OutFile ngrok.zip
          Expand-Archive -Path ngrok.zip -DestinationPath C:\ngrok
          Remove-Item ngrok.zip

      - name: Authenticate Ngrok
        run: |
          # Authenticate Ngrok with the provided token
          C:\ngrok\ngrok.exe authtoken "${{ secrets.NGROK_AUTH_TOKEN }}"

      - name: Start Ngrok Tunnel in Background
        run: |
          # Launch Ngrok in background, redirect output to a log
          Start-Process -FilePath C:\ngrok\ngrok.exe `
            -ArgumentList 'tcp 3389 --log=stdout' `
            -NoNewWindow `
            -RedirectStandardOutput ngrok.log `
            -RedirectStandardError ngrok_error.log
          # Give Ngrok time to initialize
          Start-Sleep -Seconds 10

      - name: Fetch and Print Ngrok RDP URL
        run: |
          # Read the log and extract the public tcp:// URL
          $log = Get-Content ngrok.log -Raw
          if ($log -match 'tcp://(.+?)\r') {
            Write-Host "🔗 RDP Tunnel: $($matches[1])"
            Write-Host "🛠 Connect using Administrator / your ROOT_PASSWORD secret"
          } else {
            Write-Host "❌ Could not find Ngrok URL in log. Dumping logs:"
            Write-Host $log
          }

      - name: Print Local IP Configuration
        run: ipconfig

      - name: Keep Runner Alive
        run: |
          # Prevent the VM from shutting down for 6 hours
          Start-Sleep -Seconds 21600
