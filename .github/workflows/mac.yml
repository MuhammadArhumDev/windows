name: Mac VNC

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: macos-latest

    steps:
      - name: Create VNC User Account
        run: |
          VNC_USER="vncuser"
          VNC_PASS="${{ secrets.ROOT_PASSWORD }}"

          sudo sysadminctl -addUser "$VNC_USER" \
            -password "$VNC_PASS" \
            -admin \
            -fullName "VNC User"

          sudo createhomedir -c -u "$VNC_USER" 2>/dev/null || true
          echo "Created user: $VNC_USER"

      - name: Grant Screen Capture and Accessibility Permissions (TCC)
        run: |
          TCC_DB="/Library/Application Support/com.apple.TCC/TCC.db"

          echo "--- TCC DB Schema ---"
          sudo sqlite3 "$TCC_DB" ".schema access" 2>/dev/null || echo "Could not read schema"

          CLIENTS="com.apple.screensharing com.apple.RemoteDesktop.agent com.apple.screensharing.agent"

          for CLIENT in $CLIENTS; do
            echo "Granting permissions to: $CLIENT"
            sudo sqlite3 "$TCC_DB" "INSERT OR REPLACE INTO access (service, client, client_type, auth_value, auth_reason, auth_version, csreq, policy_id, indirect_object_identifier_type, indirect_object_identifier, indirect_object_code_identity, flags, last_modified) VALUES ('kTCCServiceScreenCapture', '$CLIENT', 0, 2, 4, 1, NULL, NULL, 0, 'UNUSED', NULL, 0, strftime('%s','now'));" 2>/dev/null || true
            sudo sqlite3 "$TCC_DB" "INSERT OR REPLACE INTO access (service, client, client_type, auth_value, auth_reason, auth_version, csreq, policy_id, indirect_object_identifier_type, indirect_object_identifier, indirect_object_code_identity, flags, last_modified) VALUES ('kTCCServicePostEvent', '$CLIENT', 0, 2, 4, 1, NULL, NULL, 0, 'UNUSED', NULL, 0, strftime('%s','now'));" 2>/dev/null || true
            sudo sqlite3 "$TCC_DB" "INSERT OR REPLACE INTO access (service, client, client_type, auth_value, auth_reason, auth_version, csreq, policy_id, indirect_object_identifier_type, indirect_object_identifier, indirect_object_code_identity, flags, last_modified) VALUES ('kTCCServiceAccessibility', '$CLIENT', 0, 2, 4, 1, NULL, NULL, 0, 'UNUSED', NULL, 0, strftime('%s','now'));" 2>/dev/null || true
          done

          echo "TCC permissions granted."

      - name: Enable Screen Sharing (VNC)
        run: |
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate \
            -configure -access -on \
            -configure -allowAccessFor -allUsers \
            -configure -privs -all \
            -restart -agent

          echo "Screen Sharing enabled"

      - name: Set VNC Password
        run: |
          python3 -c "
          import os
          password = os.environ['VNC_PASS'][:8].ljust(8, chr(0))
          key = [23, 82, 107, 6, 35, 78, 88, 7]
          def rb(b):
              r = 0
              for _ in range(8):
                  r = (r << 1) | (b & 1)
                  b >>= 1
              return r
          pw = [rb(ord(c)) for c in password]
          ky = [rb(k) for k in key]
          enc = bytes([pw[i] ^ ky[i] for i in range(8)])
          with open('/tmp/vncpw', 'wb') as f:
              f.write(enc)
          print('VNC password written')
          "

          sudo mkdir -p /Library/Preferences/com.apple.RemoteManagement
          sudo cp /tmp/vncpw /Library/Preferences/com.apple.RemoteManagement/VNCPassword
          sudo chmod 600 /Library/Preferences/com.apple.RemoteManagement/VNCPassword
          sudo defaults write /Library/Preferences/com.apple.RemoteManagement VNCAlwaysStartOnConsole -bool true

          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -restart -agent

          echo "VNC password configured"
        env:
          VNC_PASS: ${{ secrets.ROOT_PASSWORD }}

      - name: Ensure GUI Console Session
        run: |
          if pgrep -x WindowServer > /dev/null; then
            echo "WindowServer is running - GUI session active"
          else
            echo "WindowServer not running - starting loginwindow"
            sudo launchctl load /System/Library/LaunchDaemons/com.apple.loginwindow.plist 2>/dev/null || true
          fi
          sleep 3
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -restart -agent
          sleep 2
          echo "Console session check complete"

      - name: Install Ngrok
        run: |
          ARCH=$(uname -m)
          if [ "$ARCH" = "arm64" ]; then
            NGROK_URL="https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-darwin-arm64.zip"
          else
            NGROK_URL="https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-darwin-amd64.zip"
          fi
          echo "Downloading Ngrok for $ARCH..."
          curl -s -L "$NGROK_URL" -o ngrok.zip
          sudo unzip -o ngrok.zip -d /usr/local/bin
          rm ngrok.zip
          ngrok version

      - name: Authenticate Ngrok
        run: ngrok authtoken "${{ secrets.NGROK_AUTH_TOKEN }}"

      - name: Start Ngrok Tunnel
        run: |
          ngrok tcp 5900 > ngrok.log 2>&1 &
          echo "Ngrok tunnel started"

      - name: Print VNC Connection Info
        run: |
          sleep 5
          echo "Runner user: $(whoami)"
          echo "Hostname: $(hostname)"
          sw_vers
          TUNNEL_INFO=$(curl -s http://127.0.0.1:4040/api/tunnels)
          PUBLIC_URL=$(echo "$TUNNEL_INFO" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['tunnels'][0]['public_url'])" 2>/dev/null || echo "UNAVAILABLE")
          if [ "$PUBLIC_URL" != "UNAVAILABLE" ]; then
            ADDR=$(echo "$PUBLIC_URL" | sed 's|tcp://||')
            HOST=$(echo "$ADDR" | rev | cut -d: -f2- | rev)
            PORT=$(echo "$ADDR" | rev | cut -d: -f1 | rev)
            echo ""
            echo "========================================"
            echo "       MAC VNC CONNECTION INFO          "
            echo "========================================"
            echo "  VNC Address : $HOST:$PORT"
            echo "  Username    : vncuser"
            echo "  Password    : (your ROOT_PASSWORD secret)"
            echo ""
            echo "  Connect with RealVNC Viewer (Windows):"
            echo "    $HOST:$PORT"
            echo ""
            echo "  Connect from Mac (Finder > Go > Connect to Server):"
            echo "    vnc://$HOST:$PORT"
            echo "========================================"
          else
            echo "ERROR: Could not get tunnel info. Check ngrok.log"
          fi

      - name: Keep Runner Alive
        run: sleep 21600
